server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O Vite gera nomes com hash (app-a1b2c3.js): o conteúdo nunca muda para
    # um mesmo nome, então pode ser cacheado para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html é o único arquivo sem hash — é ele que aponta para o bundle
    # novo. Se for cacheado, o usuário continua abrindo a versão antiga depois
    # de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router: /relatorios, /pacientes etc. não existem como arquivo. Sem
    # este fallback, recarregar a página fora da raiz devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
